<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>刘嘉伟作品集展示 - Dio哒子个人作品</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', 'PingFang SC', sans-serif; 
            background: #050508; color: #fff; overflow: hidden; 
            height: 100vh; width: 100vw; display: flex;
        }

        /* ========== Loading & Toast ========== */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.98); z-index: 9999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #loadingText { font-size: 18px; margin-top: 20px; color: #4ade80; letter-spacing: 1px; }

        #toastMsg {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 12px 28px; border-radius: 12px; font-size: 14px;
            background: rgba(20, 20, 30, 0.7); backdrop-filter: blur(12px);
            color: #fff; z-index: 10000; opacity: 0; transition: opacity 0.3s; 
            border: 1px solid rgba(255,255,255,0.12); letter-spacing: 0.5px;
        }

        /* ========== 🎨 景深层叠玻璃侧边栏 ========== */
        #sidebar {
            width: 300px; min-width: 300px; height: 100vh;
            padding: 40px 24px; z-index: 100;
            display: flex; flex-direction: column; overflow-y: auto;
            
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(40px) saturate(160%) brightness(0.9);
            -webkit-backdrop-filter: blur(40px) saturate(160%) brightness(0.9);
            
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 10px 0 40px -10px rgba(0,0,0,0.5);
            position: relative;
        }

        #sidebarBg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(50px) brightness(0.4) saturate(1.2);
            opacity: 0.6; z-index: -1;
            transition: background-image 0.8s ease-in-out, opacity 0.8s ease;
        }

        #sidebar h2 {
            font-size: 24px; color: #fff; margin-bottom: 36px;
            padding-left: 12px; font-weight: 600; letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            border-left: 3px solid #4ade80;
        }

        #tagsContainer { display: flex; flex-direction: column; gap: 10px; flex: 1; }

        .tag-item {
            padding: 16px 20px; border-radius: 14px; cursor: pointer;
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            color: rgba(255,255,255,0.7);
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative; overflow: hidden;
        }

        .tag-item::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.35s ease; border-radius: 14px;
        }

        .tag-item:hover { 
            background: rgba(255, 255, 255, 0.08); 
            transform: translateX(6px) scale(1.01); 
            color: #fff; 
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .tag-item:hover::before { opacity: 1; }

        .tag-item.active { 
            background: rgba(74, 222, 128, 0.12); 
            color: #4ade80; font-weight: 600; 
            border-color: rgba(74, 222, 128, 0.25); 
            box-shadow: 0 4px 24px rgba(74, 222, 128, 0.1), inset 0 0 20px rgba(74, 222, 128, 0.03);
            transform: translateX(6px);
        }
        .tag-item.active::before { opacity: 1; background: linear-gradient(135deg, rgba(74,222,128,0.08) 0%, transparent 60%); }

        .tag-name { font-size: 15px; letter-spacing: 0.5px; position: relative; z-index: 1; }
        
        .tag-edit-btn {
            opacity: 0; pointer-events: none; font-size: 11px; 
            padding: 5px 9px; border-radius: 8px; background: rgba(255,255,255,0.08);
            transition: all 0.25s; margin-left: 8px; position: relative; z-index: 1;
        }
        body.admin-mode .tag-edit-btn { opacity: 1; pointer-events: auto; }
        .tag-edit-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        #addTagBtn {
            margin-top: 16px; padding: 16px; border-radius: 14px; font-size: 14px;
            cursor: pointer; text-align: center; display: none;
            background: rgba(255, 255, 255, 0.02); color: rgba(255,255,255,0.5);
            border: 1px dashed rgba(255, 255, 255, 0.15); transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        body.admin-mode #addTagBtn { display: block; }
        #addTagBtn:hover { background: rgba(255, 255, 255, 0.06); color: #fff; border-color: rgba(255,255,255,0.3); }

        #adminToggleBtn {
            margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 13px;
            cursor: pointer; text-align: center; display: none;
            background: rgba(74, 222, 128, 0.08); color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15); transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        #adminToggleBtn.visible { display: block; }
        #adminToggleBtn:hover { background: rgba(74, 222, 128, 0.18); border-color: rgba(74,222,128,0.3); }

        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-track { background: transparent; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        #sidebar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* ========== 主内容区 ========== */
        #mainContent {
            flex: 1; height: 100vh; position: relative;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        #ambientLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e, #050508);
            z-index: -2; background-size: cover; background-position: center;
            filter: blur(60px) brightness(0.5); transition: background-image 0.5s ease-in-out;
        }
        #imageContainer {
            position: relative; width: 90%; height: 90%;
            display: flex; justify-content: center; align-items: center;
            /* ✅ 新增：为视差动画提供平滑过渡 */
            transition: transform 0.1s linear; 
            will-change: transform;
        }
        #mainImage {
            max-width: 100%; max-height: 100%; width: auto; height: auto;
            object-fit: contain; border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); transition: all 0.4s ease;
        }
        body:not(.admin-mode) #mainImage:hover { filter: blur(2px) brightness(0.9); transform: scale(0.99); cursor: default; }
        body.admin-mode #mainImage { cursor: pointer; border: 2px dashed rgba(74, 222, 128, 0.3); }
        body.admin-mode #mainImage:hover { border-color: #4ade80; filter: brightness(1.1); }

        .media-info {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
            padding: 18px 36px; background: rgba(10, 10, 15, 0.4); backdrop-filter: blur(16px);
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); text-align: center;
            opacity: 0; transition: all 0.4s ease; pointer-events: none; width: max-content; max-width: 80%;
        }
        #mainImage:hover ~ .media-info { transform: translateX(-50%) translateY(0); opacity: 1; }
        #mediaTitle { font-size: 20px; font-weight: bold; margin-bottom: 6px; color: #fff; letter-spacing: 1px; }
        #mediaDesc { font-size: 14px; color: rgba(255,255,255,0.7); }

        .control-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 55px; height: 55px; border-radius: 50%; 
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8);
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer; border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px); z-index: 10; transition: all 0.3s ease;
        }
        .control-btn:hover { background: rgba(255,255,255,0.15); color: #fff; transform: translateY(-50%) scale(1.1); border-color: rgba(255,255,255,0.2); }
        #prevBtn { left: 30px; } #nextBtn { right: 30px; }

        #counterInfo {
            position: absolute; bottom: 30px; right: 30px; font-size: 13px; color: rgba(255,255,255,0.4); 
            background: rgba(0,0,0,0.2); padding: 6px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(8px);
        }

        #imgAdminPanel {
            position: absolute; top: 30px; right: 30px; display: none; gap: 10px; z-index: 20;
        }
        body.admin-mode #imgAdminPanel { display: flex; }
        .admin-action-btn {
            padding: 9px 18px; border-radius: 10px; font-size: 13px; cursor: pointer;
            background: rgba(10, 10, 15, 0.5); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(12px); transition: all 0.25s; letter-spacing: 0.3px;
        }
        .admin-action-btn:hover { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.25); }
        .admin-action-btn.danger { color: #f87171; border-color: rgba(248,113,113,0.2); }
        .admin-action-btn.danger:hover { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.4); }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <i class="fas fa-cog fa-spin" style="font-size: 40px; color: #4ade80;"></i>
        <div id="loadingText">系统初始化...</div>
    </div>
    <div id="toastMsg"></div>

    <div id="sidebar">
        <div id="sidebarBg"></div>
        
        <h2>刘嘉伟个人作品集</h2>
        <div id="tagsContainer"></div>
        <button id="addTagBtn"><i class="fas fa-plus"></i> 新建标签</button>
        <button id="adminToggleBtn"><i class="fas fa-user-shield"></i> 进入管理模式</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </div>

    <div id="mainContent">
        <div id="ambientLayer"></div>
        <div id="imgAdminPanel">
            <button class="admin-action-btn" id="btnAddImg"><i class="fas fa-plus"></i> 新增图片</button>
            <button class="admin-action-btn" id="btnEditInfo"><i class="fas fa-pen"></i> 修改说明</button>
            <button class="admin-action-btn" id="btnReplaceImg"><i class="fas fa-image"></i> 替换图片</button>
            <button class="admin-action-btn danger" id="btnDeleteImg"><i class="fas fa-trash"></i> 删除</button>
        </div>

        <div id="imageContainer">
            <img id="mainImage" src="" alt="作品图片">
            <div class="media-info">
                <div id="mediaTitle">点击标签加载图片</div>
                <div id="mediaDesc">描述信息</div>
            </div>
        </div>
        
        <div id="prevBtn" class="control-btn"><i class="fas fa-chevron-left"></i></div>
        <div id="nextBtn" class="control-btn"><i class="fas fa-chevron-right"></i></div>
        <div id="counterInfo">0 / 0</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.0.min.js"></script>

    <script>
        const FALLBACK_DATA = {
            tags: [
                { id: "street", name: "街头摄影", order: 0 },
                { id: "portrait", name: "人像摄影", order: 1 },
                { id: "video", name: "视频作品", order: 2 },
                { id: "performance", name: "演出经历", order: 3 },
                { id: "other", name: "其它能力", order: 4 }
            ],
            contents: {}
        };

        function waitForSDKs() {
            if (typeof supabase !== 'undefined' && window.OSS) init();
            else setTimeout(waitForSDKs, 100);
        }

        async function init() {
            const loadingOverlay = document.getElementById("loadingOverlay");
            const loadingText = document.getElementById("loadingText");
            
            try {
                loadingOverlay.style.display = 'flex';
                loadingText.innerHTML = '系统初始化...';

                const SUPABASE_URL = 'https://quuipubvxhgvidyfqvgu.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1dWlwdWJ2eGhndmlkeWZxdmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3ODY1MTcsImV4cCI6MjA5NTM2MjUxN30.mSFIMM8XS5ifcu6KJll9zOxy0Fc5ebWy7wC6bBYTs8Q';
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                const OSS_CONFIG = {
                    region: 'oss-ap-southeast-1',
                    accessKeyId: 'LTAI5t9wJUcGzVbiR39dVxwd',
                    accessKeySecret: '11gwbNUdzY3sgXlOMu6ntqjVM00spz',
                    bucket: 'portfolio-images-dio',
                    endpoint: 'https://oss-ap-southeast-1.aliyuncs.com' 
                };

                let ossClient = null;
                try {
                    ossClient = new OSS({
                        region: OSS_CONFIG.region,
                        accessKeyId: OSS_CONFIG.accessKeyId,
                        accessKeySecret: OSS_CONFIG.accessKeySecret,
                        bucket: OSS_CONFIG.bucket,
                        endpoint: OSS_CONFIG.endpoint,
                        signatureVersion: 'v4',
                        secure: true,
                    });
                } catch (err) {
                    console.warn('OSS 初始化警告:', err.message);
                }

                loadingText.innerHTML = '拉取作品数据...';
                let worksData = await loadFromCloud(supabaseClient);
                
                if (!worksData || !worksData.tags || !worksData.contents || !Array.isArray(worksData.tags)) {
                    console.warn('云端数据无效，已启用本地兜底数据');
                    worksData = JSON.parse(JSON.stringify(FALLBACK_DATA));
                    saveToCloud(supabaseClient, worksData).catch(() => {});
                }

                setupCoreLogic(worksData, supabaseClient, ossClient, OSS_CONFIG);

            } catch (error) {
                console.error('初始化致命错误:', error);
                const fallbackCopy = JSON.parse(JSON.stringify(FALLBACK_DATA));
                setupCoreLogic(fallbackCopy, null, null, null);
            } finally {
                if (loadingOverlay) loadingOverlay.style.display = 'none';
            }
        }

        async function loadFromCloud(supabase) {
            try {
                const { data, error } = await supabase
                    .from('portfolio_data')
                    .select('data')
                    .eq('id', 1)
                    .maybeSingle();
                
                if (error) {
                    console.warn('Supabase 读取被拦截或出错:', error.message);
                    return null;
                }
                return data?.data || null;
            } catch (e) { 
                console.error('Supabase 读取异常:', e);
                return null; 
            }
        }

        async function saveToCloud(supabase, data) {
            if (!supabase) return false;
            try {
                const { error } = await supabase.from('portfolio_data').update({ data, updated_at: new Date().toISOString() }).eq('id', 1);
                if (error) throw error;
                return true;
            } catch (e) { 
                console.warn('云端保存失败(不影响本地浏览):', e.message);
                return false; 
            }
        }

        function setupCoreLogic(worksData, supabaseClient, ossClient, ossConfig) {
            const els = {
                tagsContainer: document.getElementById("tagsContainer"),
                mainImg: document.getElementById("mainImage"),
                mediaTitle: document.getElementById("mediaTitle"),
                mediaDesc: document.getElementById("mediaDesc"),
                counterInfo: document.getElementById("counterInfo"),
                adminToggle: document.getElementById("adminToggleBtn"),
                ambientLayer: document.getElementById("ambientLayer"),
                sidebarBg: document.getElementById("sidebarBg"),
                toastMsg: document.getElementById("toastMsg"),
                fileInput: document.getElementById("fileInput"),
                loadingOverlay: document.getElementById("loadingOverlay"),
                loadingText: document.getElementById("loadingText"),
                btnEditInfo: document.getElementById("btnEditInfo"),
                btnReplaceImg: document.getElementById("btnReplaceImg"),
                btnDeleteImg: document.getElementById("btnDeleteImg"),
                btnAddImg: document.getElementById("btnAddImg"),
                addTagBtn: document.getElementById("addTagBtn"),
                prevBtn: document.getElementById("prevBtn"),
                nextBtn: document.getElementById("nextBtn"),
                imageContainer: document.getElementById("imageContainer") // ✅ 获取容器用于视差
            };

            let state = {
                currentTagId: worksData.tags?.[0]?.id || "",
                adminMode: false,
                currentList: [],
                currentIdx: 0,
                dCount: 0,
                dTimer: null,
                uploadAction: null
            };

            function showToast(text) {
                if (!els.toastMsg) return;
                els.toastMsg.textContent = text;
                els.toastMsg.style.opacity = '1';
                setTimeout(() => els.toastMsg.style.opacity = '0', 2500);
            }

            function updateAmbientBackground(imageUrl) {
                const bg = imageUrl ? `url('${imageUrl}')` : 'radial-gradient(circle at center, #1a1a2e, #050508)';
                if (els.ambientLayer) els.ambientLayer.style.backgroundImage = bg;
                if (els.sidebarBg) {
                    els.sidebarBg.style.backgroundImage = imageUrl ? `url('${imageUrl}')` : 'none';
                    els.sidebarBg.style.opacity = imageUrl ? '0.6' : '0';
                }
            }

            function loadImage() {
                if (!state.currentList.length) {
                    els.mainImg.src = "";
                    els.mediaTitle.innerText = "暂无内容";
                    els.mediaDesc.innerText = state.adminMode ? "点击右上角「新增图片」或点击此区域添加" : "";
                    els.counterInfo.innerText = "0 / 0";
                    updateAmbientBackground('');
                    return;
                }
                const item = state.currentList[state.currentIdx];
                els.mainImg.src = item.url;
                els.mediaTitle.innerText = item.title || "未命名";
                els.mediaDesc.innerText = item.desc || "";
                els.counterInfo.innerText = `${state.currentIdx + 1}/${state.currentList.length}`;
                updateAmbientBackground(item.url);
            }

            function renderTags() {
                if (!els.tagsContainer) return;
                els.tagsContainer.innerHTML = '';
                [...(worksData.tags || [])].sort((a,b) => a.order - b.order).forEach(tag => {
                    const div = document.createElement('div');
                    div.className = `tag-item ${state.currentTagId === tag.id ? 'active' : ''}`;
                    div.innerHTML = `
                        <span class="tag-name">${tag.name}</span>
                        <span class="tag-edit-btn" data-tag="${tag.id}"><i class="fas fa-pen"></i></span>
                    `;
                    
                    div.onclick = () => {
                        state.currentTagId = tag.id;
                        state.currentIdx = 0;
                        updateList();
                        renderTags();
                    };

                    div.querySelector('.tag-edit-btn').onclick = (e) => {
                        e.stopPropagation();
                        const newName = prompt("修改标签名称：", tag.name);
                        if (newName && newName !== tag.name) {
                            tag.name = newName;
                            saveToCloud(supabaseClient, worksData);
                            renderTags();
                            showToast("标签已更新");
                        }
                    };
                    els.tagsContainer.appendChild(div);
                });
            }

            function updateList() {
                state.currentList = (worksData.contents[state.currentTagId] || []).filter(i => i.type === 'image');
                loadImage();
            }

            async function handleImageUpload(file) {
                if (!ossClient) { showToast('OSS未初始化，无法上传'); return null; }
                if (!file.type.startsWith('image/')) { showToast("仅支持图片文件"); return null; }
                try {
                    els.loadingOverlay.style.display = 'flex';
                    els.loadingText.innerHTML = '上传中... 0%';
                    
                    const ext = file.name.split('.').pop().toLowerCase(); 
                    const fileName = `uploads/${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${ext}`;
                    
                    await ossClient.put(fileName, file, {
                        progress: (p) => els.loadingText.innerHTML = `上传中... ${Math.round(p * 100)}%`,
                        mime: file.type || 'image/png' 
                    });
                    
                    return `https://${ossConfig.bucket}.${ossConfig.endpoint.replace('https://', '')}/${fileName}`;
                } catch (err) {
                    showToast(`上传失败: ${err.message}`);
                    return null;
                } finally {
                    els.loadingOverlay.style.display = 'none';
                }
            }

            // ========== 核心事件绑定 ==========
            
            renderTags(); 
            updateList();

            els.mainImg.addEventListener('click', () => {
                if (!state.adminMode) return;
                state.uploadAction = 'add';
                els.fileInput.click();
            });

            els.btnAddImg.addEventListener('click', () => {
                if (!state.currentTagId) return showToast("请先选择或创建一个标签");
                state.uploadAction = 'add';
                els.fileInput.click();
            });

            els.addTagBtn.addEventListener('click', () => {
                const tagName = prompt("请输入新标签名称：");
                if (!tagName || !tagName.trim()) return;
                
                const newId = tagName.trim().toLowerCase().replace(/\s+/g, '_') + '_' + Date.now();
                const maxOrder = worksData.tags.reduce((max, t) => Math.max(max, t.order || 0), -1);
                
                worksData.tags.push({ id: newId, name: tagName.trim(), order: maxOrder + 1 });
                if (!worksData.contents[newId]) worksData.contents[newId] = [];
                
                saveToCloud(supabaseClient, worksData);
                state.currentTagId = newId;
                state.currentIdx = 0;
                renderTags();
                updateList();
                showToast("新标签已创建");
            });

            if (els.prevBtn) {
                els.prevBtn.addEventListener('click', () => {
                    if (!state.currentList.length) return;
                    state.currentIdx = (state.currentIdx - 1 + state.currentList.length) % state.currentList.length;
                    loadImage();
                });
            }
            if (els.nextBtn) {
                els.nextBtn.addEventListener('click', () => {
                    if (!state.currentList.length) return;
                    state.currentIdx = (state.currentIdx + 1) % state.currentList.length;
                    loadImage();
                });
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && state.currentList.length) {
                    state.currentIdx = (state.currentIdx - 1 + state.currentList.length) % state.currentList.length;
                    loadImage();
                }
                if (e.key === 'ArrowRight' && state.currentList.length) {
                    state.currentIdx = (state.currentIdx + 1) % state.currentList.length;
                    loadImage();
                }
                if (e.key.toLowerCase() === 'd') {
                    if (state.dTimer) clearTimeout(state.dTimer);
                    state.dCount++;
                    if (state.dCount >= 5) {
                        els.adminToggle.classList.add('visible');
                        showToast("管理入口已解锁");
                        state.dCount = 0;
                    }
                    state.dTimer = setTimeout(() => state.dCount = 0, 1000);
                }
            });

            els.adminToggle.addEventListener('click', () => {
                state.adminMode = !state.adminMode;
                document.body.classList.toggle('admin-mode', state.adminMode);
                els.adminToggle.innerHTML = state.adminMode 
                    ? '<i class="fas fa-eye"></i> 退出管理模式' 
                    : '<i class="fas fa-user-shield"></i> 进入管理模式';
                renderTags();
                loadImage();
                showToast(state.adminMode ? "已进入管理模式" : "已返回访客模式");
            });

            els.btnEditInfo.addEventListener('click', () => {
                if (!state.currentList.length) return showToast("当前没有图片");
                const item = state.currentList[state.currentIdx];
                const newTitle = prompt("修改标题：", item.title || "");
                if (newTitle === null) return;
                const newDesc = prompt("修改描述：", item.desc || "");
                if (newDesc === null) return;
                item.title = newTitle;
                item.desc = newDesc;
                saveToCloud(supabaseClient, worksData);
                loadImage();
                showToast("说明文本已更新");
            });

            els.btnReplaceImg.addEventListener('click', () => {
                if (!state.currentList.length) return showToast("当前没有图片");
                state.uploadAction = 'replace';
                els.fileInput.click();
            });

            els.btnDeleteImg.addEventListener('click', async () => {
                if (!state.currentList.length) return showToast("当前没有图片");
                if (!confirm("确定要删除这张图片吗？此操作不可撤销。")) return;
                state.currentList.splice(state.currentIdx, 1);
                worksData.contents[state.currentTagId] = state.currentList;
                if (state.currentIdx >= state.currentList.length) {
                    state.currentIdx = Math.max(0, state.currentList.length - 1);
                }
                await saveToCloud(supabaseClient, worksData);
                updateList();
                showToast("图片已删除");
            });

            els.fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (!state.currentTagId) {
                    showToast("请先选择或创建一个标签");
                    e.target.value = '';
                    return;
                }

                const url = await handleImageUpload(file);
                if (!url) { e.target.value = ''; return; }

                if (state.uploadAction === 'add') {
                    const title = prompt("请输入作品标题：", "新作品");
                    const desc = prompt("请输入作品描述：", "");
                    if (!worksData.contents[state.currentTagId]) worksData.contents[state.currentTagId] = [];
                    worksData.contents[state.currentTagId].push({ type: "image", url, title: title || "未命名", desc: desc || "" });
                    await saveToCloud(supabaseClient, worksData);
                    state.currentIdx = worksData.contents[state.currentTagId].length - 1;
                    updateList();
                    showToast("新图片已添加");
                } else if (state.uploadAction === 'replace') {
                    const item = state.currentList[state.currentIdx];
                    item.url = url;
                    await saveToCloud(supabaseClient, worksData);
                    loadImage();
                    showToast("图片已替换");
                }

                state.uploadAction = null;
                e.target.value = '';
            });

            // ✅ ========== 新增：右侧画面鼠标视差悬浮效果 ==========
            // 使用 requestAnimationFrame 确保 60fps 丝滑流畅，且不阻塞主线程
            const PARALLAX_INTENSITY = 15; // 移动幅度（像素），可根据喜好调整
            let targetX = 0, targetY = 0;
            let currentX = 0, currentY = 0;

            document.getElementById('mainContent').addEventListener('mousemove', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                // 计算鼠标在容器内的相对位置 (-0.5 ~ 0.5)
                const xRatio = (e.clientX - rect.left) / rect.width - 0.5;
                const yRatio = (e.clientY - rect.top) / rect.height - 0.5;
                
                // 反向移动以产生“窗口透视”的物理直觉
                targetX = -xRatio * PARALLAX_INTENSITY;
                targetY = -yRatio * PARALLAX_INTENSITY;
            });

            // 鼠标离开时缓慢回正
            document.getElementById('mainContent').addEventListener('mouseleave', () => {
                targetX = 0;
                targetY = 0;
            });

            function animateParallax() {
                // 线性插值 (Lerp) 实现阻尼缓动效果
                currentX += (targetX - currentX) * 0.08;
                currentY += (targetY - currentY) * 0.08;

                // 仅当有微小位移时才更新 DOM，节省性能
                if (Math.abs(targetX - currentX) > 0.01 || Math.abs(targetY - currentY) > 0.01) {
                    if (els.imageContainer) {
                        els.imageContainer.style.transform = `translate(${currentX}px, ${currentY}px)`;
                    }
                }
                requestAnimationFrame(animateParallax);
            }
            // 启动视差动画循环
            animateParallax();
        }

        document.addEventListener('DOMContentLoaded', waitForSDKs);
    </script>
</body>
</html>
